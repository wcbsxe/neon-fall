<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>霓虹坠落 · NEON FALL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 28%, #0c1236 0%, #060818 46%, #010206 100%);
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #dfe7ff; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  canvas#game {
    display: block; border-radius: 18px;
    box-shadow: 0 0 90px rgba(90,130,255,.20), 0 0 30px rgba(120,80,255,.14), 0 26px 80px rgba(0,0,0,.66);
    touch-action: none;
  }
  #pad { display: none; gap: 8px; padding: 0 8px; }
  #pad button {
    flex: 1 1 0; min-width: 52px; height: 58px;
    border: 1px solid rgba(120,160,255,.32);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(34,48,96,.85), rgba(12,18,42,.9));
    color: #b9ccff; font-size: 20px; font-weight: 700;
    font-family: inherit; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 4px 14px rgba(0,0,0,.4);
    -webkit-user-select: none; user-select: none;
  }
  #pad button:active { background: linear-gradient(180deg, rgba(70,100,190,.9), rgba(28,42,96,.95)); transform: translateY(1px); }
  @media (pointer: coarse) { #pad { display: flex; } canvas#game { border-radius: 12px; } }
  @media (max-height: 460px) { #pad { display: none !important; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="1024" height="700"></canvas>
  <div id="pad">
    <button data-act="left" aria-label="左移">◀</button>
    <button data-act="rotL" aria-label="逆时针旋转">↺</button>
    <button data-act="rotR" aria-label="顺时针旋转">↻</button>
    <button data-act="down" aria-label="软降">▼</button>
    <button data-act="drop" aria-label="硬降">⤓</button>
    <button data-act="hold" aria-label="暂存">H</button>
    <button data-act="right" aria-label="右移">▶</button>
  </div>
</div>
<script src="game.js"></script>
<script>
// 浏览器把 file:// 页面带进标题栏时会显示成 "_/D:/..." 这种路径；
// 页面脚本会自动把 document.title 改回游戏名，这里再兜一层。
document.title = '霓虹坠落 · NEON FALL';
</script>
</body>
</html>
